<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tunnel Illusion 49</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030307;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #illusionContainer {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1100px;
            max-height: 800px;
            background: #000;
            border: 4px solid #111;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="illusionContainer">
        <canvas id="shearCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('shearCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('illusionContainer');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let timeFactor = 0;
        const totalRings = 45; // Increased ring count for a denser tunnel

        function runIllusionLoop() {
            // Smooth, rich motion trails
            ctx.fillStyle = 'rgba(3, 3, 7, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // SPEED UP: Increased clock step for faster forward momentum
            timeFactor += 0.042; 

            // Track global shape morph cycle over time
            const morphCycle = (timeFactor * 0.15) % 3; 

            for (let i = totalRings; i > 0; i--) {
                const zProgress = (i - (timeFactor % 1)) / totalRings;
                const scale = Math.pow(1 - zProgress, 3.5) * 12; 
                if (scale <= 0.05) continue;

                ctx.save();
                ctx.translate(centerX, centerY);

                // Anamorphic matrix tilt & twist distortion
                const shearAngleX = Math.sin(timeFactor * 0.5 + (i * 0.05)) * 0.55;
                const shearAngleY = Math.cos(timeFactor * 0.4 + (i * 0.04)) * 0.25;
                ctx.transform(1, shearAngleY, shearAngleX, 1, 0, 0);
                ctx.rotate(timeFactor * 0.35 + (i * 0.07));

                // COLORS: Dynamic chromatic progression based on tunnel depth
                const baseHue = (timeFactor * 80 + i * 14) % 360;
                ctx.strokeStyle = `hsl(${baseHue}, 100%, 60%)`;
                ctx.lineWidth = Math.max(1.2, scale * 1.8);

                // Geometric dimensions
                const pointsCount = 6 + (i % 2); 
                const outerRadius = scale * 45;
                const innerRadius = scale * 18;
                const midRadius = (outerRadius + innerRadius) * 0.5;
                const amplitude = (outerRadius - innerRadius) * 0.5;

                ctx.beginPath();

                // Generate flower path by continuously computing shifting profiles
                for (let a = 0; a <= Math.PI * 2; a += 0.05) {
                    // Profile 1: Smooth wave petals
                    const rWave = midRadius + Math.sin(a * pointsCount) * amplitude;

                    // Profile 2: Pointed star points
                    const starWave = Math.abs(((a * pointsCount / Math.PI) % 2) - 1) * 2 - 1;
                    const rStar = midRadius + starWave * amplitude;

                    // Profile 3: Blocky gear teeth
                    const gearWave = Math.tanh(Math.sin(a * pointsCount) * 5);
                    const rGear = midRadius + gearWave * amplitude;

                    // Smooth blending interpolation based on the morph clock
                    let finalRadius = rWave;
                    if (morphCycle < 1) {
                        // Blend Wave to Star
                        const t = morphCycle;
                        finalRadius = rWave * (1 - t) + rStar * t;
                    } else if (morphCycle < 2) {
                        // Blend Star to Gear
                        const t = morphCycle - 1;
                        finalRadius = rStar * (1 - t) + rGear * t;
                    } else {
                        // Blend Gear back to Wave
                        const t = morphCycle - 2;
                        finalRadius = rGear * (1 - t) + rWave * t;
                    }

                    const px = Math.cos(a) * finalRadius;
                    const py = Math.sin(a) * finalRadius;

                    if (a === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }

                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(runIllusionLoop);
        }

        runIllusionLoop();
    </script>
</body>
</html>
