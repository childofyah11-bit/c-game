<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tunnel Illusion</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030307;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #illusionContainer {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1100px;
            max-height: 800px;
            background: #000;
            /* Border cuts off linear paths perfectly to enhance edge parallax translation */
            border: 4px solid #111;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="illusionContainer">
        <canvas id="shearCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('shearCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('illusionContainer');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let timeFactor = 0;
        const totalRings = 42; // Number of layered depth frames

        function runIllusionLoop() {
            // Intense motion-blur masking to merge frames into smooth depth gradients
            ctx.fillStyle = 'rgba(3, 3, 7, 0.14)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            timeFactor += 0.015;

            // Generate depth patterns from background forward to stack depth accurately
            for (let i = totalRings; i > 0; i--) {
                // Non-linear depth distribution (creates exponential forward zoom speed)
                const zProgress = (i - (timeFactor % 1)) / totalRings;
                const scale = Math.pow(1 - zProgress, 3.5) * 12; // Hyperbolic scale transformation
                
                if (scale <= 0.05) continue;

                ctx.save();
                ctx.translate(centerX, centerY);

                // ANAMORPHIC SHEAR LOOPHOLE:
                // Skews the drawing canvas matrix across asymmetrical 3D tilt steps.
                // The brain processes horizontal shear deformation as depth distance rotation.
                const shearAngleX = Math.sin(timeFactor * 0.4 + (i * 0.05)) * 0.55;
                const shearAngleY = Math.cos(timeFactor * 0.3 + (i * 0.04)) * 0.25;
                ctx.transform(1, shearAngleY, shearAngleX, 1, 0, 0);

                // Smooth rotational vortex tumble to anchor the rolling perspective trap
                ctx.rotate(timeFactor * 0.2 + (i * 0.08));

                // Color shifts dynamically based on proximity to mimic heat/light distortion
                const luminance = Math.floor((1 - zProgress) * 255);
                const neonColor = `hsl(${(timeFactor * 40 + i * 8) % 360}, 100%, 55%)`;

                ctx.strokeStyle = neonColor;
                ctx.lineWidth = Math.max(1, scale * 1.5);
                
                // Draw a complex multi-point star ring
                ctx.beginPath();
                const pointsCount = 6; // Hexagonal layout gives distinct flat edges for your eye tracking
                const outerRadius = scale * 45;
                const innerRadius = scale * 18;

                for (let p = 0; p < pointsCount * 2; p++) {
                    const currentAngle = (p * Math.PI) / pointsCount;
                    const r = (p % 2 === 0) ? outerRadius : innerRadius;
                    const px = Math.cos(currentAngle) * r;
                    const py = Math.sin(currentAngle) * r;

                    if (p === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(runIllusionLoop);
        }

        runIllusionLoop();
    </script>
</body>
</html>
