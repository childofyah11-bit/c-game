<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropper 2026</title>
    <style>
        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            overflow: hidden;
            padding: 10px;
        }
        h1 {
            margin: 5px 0;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 24px;
        }
        #gameContainer {
            position: relative;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        /* Canvas is optimized for smooth, continuous physics rendering */
        canvas {
            background: linear-gradient(180s, #0d1527 0%, #070a14 100%);
            border: 3px solid #00ffcc;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 8, 17, 0.9);
            border: 2px solid #ff3344;
            padding: 20px 40px;
            border-radius: 5px;
            display: none;
            text-align: center;
            box-shadow: 0 0 20px #ff3344;
        }
        .btn {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #00ffcc;
            color: #050811;
            box-shadow: 0 0 15px #00ffcc;
        }
        .controls-hint {
            margin-top: 5px;
            font-size: 12px;
            color: #88aaff;
        }
    </style>
</head>
<body>

    <h1>🌀 CYBER DROPPER 🌀</h1>
    <div style="font-size: 18px; font-weight: bold;">SCORE: <span id="scoreVal">0</span></div>
    <div class="controls-hint">Use LEFT / RIGHT Arrow Keys or A / D to steer your probe</div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOverScreen" class="ui-overlay">
            <h2 style="color: #ff3344; margin: 0 0 10px 0; letter-spacing: 2px;">PROBE DESTROYED</h2>
            <p>Final Depth Reached: <span id="finalScore">0</span>m</p>
            <button class="btn" onclick="resetGame()">Relaunch Probe</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');

        // Game Configuration
        let score = 0;
        let gameActive = true;
        let gameSpeed = 4;

        // Player (Dropping Probe) Layout
        const player = {
            x: 200,
            y: 120, // Stays in upper third while world moves past it
            radius: 12,
            speed: 7,
            dx: 0
        };

        // Obstacles (Walls with escape gaps)
        let gates = [];
        const gateHeight = 20;
        const gateGapWidth = 90;
        const spawnDistance = 180; // Distance between incoming obstacles

        // Handle Keyboard Events
        const keys = {};
        document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function createGate(yPosition) {
            // Pick a completely random slot center across the horizontal field
            const gapX = Math.random() * (canvas.width - gateGapWidth - 40) + 20;
            gates.push({ y: yPosition, gapX: gapX });
        }

        // Initialize starting walls below the player
        function initGates() {
            gates = [];
            createGate(canvas.height);
            createGate(canvas.height + spawnDistance);
            createGate(canvas.height + spawnDistance * 2);
        }

        function updatePhysics() {
            if (!gameActive) return;

            // Player Steering Logic
            if (keys['arrowleft'] || keys['a']) player.dx = -player.speed;
            else if (keys['arrowright'] || keys['d']) player.dx = player.speed;
            else player.dx = 0;

            player.x += player.dx;

            // Screen Boundary Hard Stops
            if (player.x - player.radius < 0) player.x = player.radius;
            if (player.x + player.radius > canvas.width) player.x = canvas.width - player.radius;

            // Obstacle Movement and Scoring Update Loops
            gates.forEach((gate) => {
                gate.y -= gameSpeed; // Moving obstacles upwards simulates falling downward

                // Collision Detection Framework
                if (player.y + player.radius > gate.y && player.y - player.radius < gate.y + gateHeight) {
                    // Check if player position is outside the safety gap bounds
                    if (player.x - player.radius < gate.gapX || player.x + player.radius > gate.gapX + gateGapWidth) {
                        endGame();
                    }
                }
            });

            // Clean up off-screen gates and increment layout scores
            if (gates.length > 0 && gates[0].y + gateHeight < 0) {
                gates.shift();
                score += 10;
                scoreVal.textContent = score;
                
                // Gradually step up velocity over time to boost pressure
                if (score % 40 === 0) gameSpeed += 0.5;

                // Spawn a new gate sequence at the tail end
                const lastGateY = gates[gates.length - 1].y;
                createGate(lastGateY + spawnDistance);
            }
        }

        function renderGraphics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Cyber Grid Illusion Lines (Moving upward)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 2;
            const lineOffset = (performance.now() * (gameSpeed / 10)) % 40;
            for (let y = -lineOffset; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Obstacle Barriers
            gates.forEach(gate => {
                ctx.fillStyle = '#ff3344';
                ctx.shadowColor = '#ff3344';
                ctx.shadowBlur = 8;

                // Left Segment of the block wall
                ctx.fillRect(0, gate.y, gate.gapX, gateHeight);
                // Right Segment of the block wall
                ctx.fillRect(gate.gapX + gateGapWidth, gate.y, canvas.width - (gate.gapX + gateGapWidth), gateHeight);
            });

            // Draw Core Player Target Sphere
            ctx.fillStyle = '#00ffcc';
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Clear glow artifacts from standard vector context
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            updatePhysics();
            renderGraphics();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            finalScore.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            score = 0;
            gameSpeed = 4;
            player.x = 200;
            scoreVal.textContent = score;
            gameOverScreen.style.display = 'none';
            initGates();
            gameActive = true;
        }

        // Boot system parameters
        initGates();
        gameLoop();
    </script>
</body>
</html>
