<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chromatic Metamorphic Flower Engine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000002;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvasContainer {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1100px;
            max-height: 800px;
            background: #000;
            border: 2px solid #030814;
            box-shadow: 0 0 80px rgba(0,0,0,1);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="canvasContainer">
        <canvas id="ultraMorphCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('ultraMorphCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let timeFactor = 0;
        const totalLayers = 65; // Ultra-dense array completely exhausts tracking cells

        // Advanced multi-vector geometry generator supporting 5 distinct structural configurations
        function drawAdvancedPetals(ctx, radius, basePetals, rotation, morphStage) {
            ctx.beginPath();
            const resolution = 180; // High vector density for flawless curve rendering

            for (let i = 0; i <= resolution; i++) {
                const angle = (i * Math.PI * 2) / resolution + rotation;

                // 1. ROSE MODEL: Sharp alternating star ridges
                const roseMod = Math.abs(Math.sin(angle * (basePetals / 2)));

                // 2. TULIP MODEL: Deeply cupped smooth structural lobes
                const tulipMod = 0.65 + Math.sin(angle * basePetals) * 0.35;

                // 3. LOTUS MODEL: Highly frequent star flare vertices
                const lotusMod = 0.4 + Math.abs(Math.cos(angle * basePetals * 1.5)) * 0.6;

                // 4. SUNFLOWER MODEL: Dense overlapping multi-layered small fringes
                const sunflowerMod = 0.85 + Math.sin(angle * 24) * 0.15;

                // 5. HIBISCUS MODEL: Wide, asymmetrical fluid rippling waves
                const hibiscusMod = 0.75 + Math.sin(angle * 3) * 0.2 * Math.cos(angle * basePetals);

                // Multi-stage linear interpolation array loop to blend 5 states smoothly
                let finalMod = 1;
                
                if (morphStage < 1) {      // Stage 0 -> 1: Rose to Tulip
                    finalMod = roseMod * (1 - morphStage) + tulipMod * morphStage;
                } else if (morphStage < 2) { // Stage 1 -> 2: Tulip to Lotus
                    const t = morphStage - 1;
                    finalMod = tulipMod * (1 - t) + lotusMod * t;
                } else if (morphStage < 3) { // Stage 2 -> 3: Lotus to Sunflower
                    const t = morphStage - 2;
                    finalMod = lotusMod * (1 - t) + sunflowerMod * t;
                } else {                     // Stage 3 -> 4: Sunflower to Hibiscus (and cycles back)
                    const t = morphStage - 3;
                    finalMod = sunflowerMod * (1 - t) + hibiscusMod * t;
                }

                const finalRadius = radius * finalMod;
                const x = Math.cos(angle) * finalRadius;
                const y = Math.sin(angle) * finalRadius;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        function runNeuralEngine() {
            // Tighten trailing decay to emphasize hyper-speed edge paths
            ctx.fillStyle = 'rgba(0, 0, 2, 0.11)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            timeFactor += 0.008; // Steady time progression vector

            // HYPER-VELOCITY ENGINE ACCELERATION:
            // Multiplied by 1.25 to force rapid shape evolution across 4 distinct blending thresholds
            const totalPhases = 4;
            const morphCycle = (timeFactor * 1.25) % totalPhases; 
            
            let activeBasePetals = 5;
            if (morphCycle < 1) activeBasePetals = 5;      // Rose / Tulip nodes
            else if (morphCycle < 2) activeBasePetals = 6; // Lotus lobes
            else if (morphCycle < 3) activeBasePetals = 12;// Sunflower base symmetry
            else activeBasePetals = 5;                     // Hibiscus waves

            for (let i = totalLayers; i > 0; i--) {
                const progress = (i - (timeFactor * 32 % 1)) / totalLayers; // Accelerated forward rush
                const scale = Math.pow(1 - progress, 4.8) * 20; // Hyper-warped focal length expansion

                if (scale <= 0.01) continue;

                ctx.save();
                ctx.translate(centerX, centerY);

                const directionToggle = (i % 2 === 0) ? 1 : -1;
                const rotationShift = (timeFactor * 0.45) * directionToggle + (i * 0.06);

                // Asymmetric lens distortion matrix
                const sX = Math.sin(timeFactor * 0.35) * 0.08;
                const sY = Math.cos(timeFactor * 0.22) * 0.08;
                ctx.transform(1, sY, sX, 1, 0, 0);

                // CHROMATIC PHASE SPLITTING:
                // Odd layers utilize the primary spectrum, even layers invert 180 degrees into the exact opposite tint field.
                // This hyper-contrast tricks retinal cells into assigning depth boundaries between layers.
                let hue = (timeFactor * 40 + i * 4) % 360;
                if (i % 2 === 0) {
                    hue = (hue + 180) % 360; // Flashes complementary contrasting colors side-by-side
                }

                ctx.strokeStyle = `hsl(${hue}, 100%, 55%)`;
                ctx.lineWidth = Math.max(0.5, scale * 1.4);

                const currentBaseRadius = scale * 48;
                
                drawAdvancedPetals(ctx, currentBaseRadius, activeBasePetals, rotationShift, morphCycle);

                ctx.restore();
            }

            requestAnimationFrame(runNeuralEngine);
        }

        runNeuralEngine();
    </script>
</body>
</html>
