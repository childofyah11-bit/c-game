<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3DSpiralVortex</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #010205;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* The Focal Window Frame */
        #vortexFrame {
            position: relative;
            width: 90vw;
            height: 85vh;
            max-width: 1000px;
            max-height: 750px;
            border: 6px double #0d1b2a;
            background: #020408;
            box-shadow: 
                0 0 60px rgba(0, 0, 0, 0.95),
                inset 0 0 80px rgba(0, 255, 230, 0.05);
            overflow: visible; /* Allows spiral rings to burst out of the frame bounds */
            box-sizing: border-box;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .alert-text {
            position: absolute;
            top: -40px;
            width: 100%;
            text-align: center;
            color: #ff3344;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(255, 51, 68, 0.4);
            animation: flash 1.5s infinite;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="vortexFrame">
        <div class="alert-text">⚠️ WARNING: MAXIMUM COGNITIVE DEPTH OVERDRIVE ⚠️</div>
        <canvas id="vortexCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('vortexCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('vortexFrame');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Engine Variables
        let globalRotation = 0;
        const totalNodes = 180; // Massive node trace count for a solid geometry line look
        const maxDepth = 900;
        const focalPlaneZ = 180; // The spatial tipping point where lines break through the display glass

        function renderVortex() {
            // Keep the trail fade ultra-dark and precise for neon light clarity
            ctx.fillStyle = 'rgba(1, 2, 5, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Slowly increment rotation speed to feed the spiral illusion spin
            globalRotation += 0.025;

            // Store fully calculated 3D coordinates for projection mapping
            const points = [];

            for (let i = 0; i < totalNodes; i++) {
                // Distribute nodes chronologically along a deep spatial pipeline
                const progress = i / totalNodes;
                
                // Animate depth z positioning over time to create a forward moving effect
                let z = maxDepth - ((progress * maxDepth + globalRotation * 80) % maxDepth);
                
                // Exponential math formulas to weave nodes into a hyper-helix thread
                const helixRadius = 140 * Math.log(maxDepth / (z + 20)); 
                const spiralAngle = (progress * Math.PI * 14) + (globalRotation * 0.5);

                // Derive 3D raw space points
                const x = Math.cos(spiralAngle) * helixRadius;
                const y = Math.sin(spiralAngle) * helixRadius;

                // Project 3D coordinate space onto flat 2D viewport surface
                const scaleFactor = 380 / (z + 100);
                const projX = x * scaleFactor + centerX;
                const projY = y * scaleFactor + centerY;
                const nodeSize = Math.max(1, (1.2 - (z / maxDepth)) * 7);

                // Compute exact stereoscopic channel variance split distances
                const stereoDisparity = ((z - focalPlaneZ) / maxDepth) * 26;

                points.push({
                    x: projX,
                    y: projY,
                    size: nodeSize,
                    disparity: stereoDisparity,
                    z: z
                });
            }

            // Draw connecting lines between mapped vertices to construct geometric walls
            ctx.globalCompositeOperation = 'screen';

            // PHASE 1: THE STEREO RED TUNNEL CHANNEL (Left eye map offset)
            ctx.strokeStyle = 'rgba(255, 10, 50, 0.75)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let i = 0; i < points.length - 1; i++) {
                // If nodes jump boundaries during recycling loop, skip linking line
                if (points[i].z > points[i+1].z) continue;
                
                if (i === 0) ctx.moveTo(points[i].x - points[i].disparity, points[i].y);
                else ctx.lineTo(points[i].x - points[i].disparity, points[i].y);
            }
            ctx.stroke();

            // PHASE 2: THE STEREO CYAN TUNNEL CHANNEL (Right eye map offset)
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.75)';
            ctx.beginPath();
            for (let i = 0; i < points.length - 1; i++) {
                if (points[i].z > points[i+1].z) continue;

                if (i === 0) ctx.moveTo(points[i].x + points[i].disparity, points[i].y);
                else ctx.lineTo(points[i].x + points[i].disparity, points[i].y);
            }
            ctx.stroke();

            // Draw glowing node points as they get close to create a splatter look
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                if (p.z < focalPlaneZ + 100) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fillRect(p.x - p.disparity - (p.size/2), p.y - (p.size/2), p.size, p.size);
                    ctx.fillRect(p.x + p.disparity - (p.size/2), p.y - (p.size/2), p.size, p.size);
                }
            }

            requestAnimationFrame(renderVortex);
        }

        renderVortex();
    </script>
</body>
</html>
