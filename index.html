<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlowerIllusion</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020205;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvasContainer {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1100px;
            max-height: 800px;
            background: #000;
            border: 2px solid #0a1128;
            box-shadow: 0 0 60px rgba(0,0,0,1);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="canvasContainer">
        <canvas id="flowerCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let timeFactor = 0;
        const totalLayers = 55; // High layer density overloads the eye tracking field

        function drawPetalLoop(ctx, radius, petalCount, rotation) {
            ctx.beginPath();
            for (let i = 0; i < petalCount * 2; i++) {
                const angle = (i * Math.PI) / petalCount + rotation;
                
                // Modulating the radius alternately creates a fluid, wavy rosette footprint
                const r = (i % 2 === 0) ? radius : radius * 0.45;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        function runNeuralEngine() {
            // High persistence decay values leave long trailing ghost lines to trap focus
            ctx.fillStyle = 'rgba(2, 2, 5, 0.09)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            timeFactor += 0.009; // A slow, hypnotic pace maximizes the staring effect

            // Generate concentric flower configurations from foreground to background
            for (let i = totalLayers; i > 0; i--) {
                // Exponential spacing structure mimics deep optical lenses
                const progress = (i - (timeFactor * 18 % 1)) / totalLayers;
                const scale = Math.pow(1 - progress, 4.0) * 16;

                if (scale <= 0.02) continue;

                ctx.save();
                ctx.translate(centerX, centerY);

                // LAYER-SPECIFIC ALTERNATING TWISTS:
                // Odd and even layers rotate in opposite directions.
                // This counter-rotation destabilizes peripheral vision, making the center pop.
                const directionToggle = (i % 2 === 0) ? 1 : -1;
                const rotationShift = (timeFactor * 0.45) * directionToggle + (i * 0.04);
                
                // Introduce an anamorphic pulsing tilt to create a simulated 3D sway
                const swayX = Math.sin(timeFactor * 0.3) * 0.12;
                const swayY = Math.cos(timeFactor * 0.2) * 0.12;
                ctx.transform(1, swayY, swayX, 1, 0, 0);

                // Deep space gradient color mapping
                const hue = (timeFactor * 25 + i * 5) % 360;
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                
                // Linewidth increases exponentially as it expands to emulate nearing proximity
                ctx.lineWidth = Math.max(0.8, scale * 1.8);

                // Render the individual flower layer node
                const baseRadius = scale * 50;
                const petalDensity = 8; // Geometric symmetry anchors focus
                drawPetalLoop(ctx, baseRadius, petalDensity, rotationShift);

                ctx.restore();
            }

            requestAnimationFrame(runNeuralEngine);
        }

        runNeuralEngine();
    </script>
</body>
</html>
