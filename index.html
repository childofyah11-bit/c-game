<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020408;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Forces browser rendering engine into 3D space mode */
        }

        /* The Focal Plane: Acts like a flat window frame. Objects passing *over* this appear in front of the screen */
        #viewportBoundary {
            position: relative;
            width: 85vw;
            height: 85vh;
            max-width: 900px;
            max-height: 700px;
            border: 8px double #1a2942;
            background: radial-gradient(circle at center, #070e1b 0%, #02050a 100%);
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.9),
                inset 0 0 100px rgba(0, 255, 204, 0.08);
            overflow: visible; /* CRITICAL: Allows shapes to physically leave the boundary box */
            box-sizing: border-box;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .glasses-hint {
            position: absolute;
            bottom: -45px;
            width: 100%;
            text-align: center;
            color: #4b6584;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="viewportBoundary">
        <canvas id="hyper3dCanvas"></canvas>
        <div class="glasses-hint">🕶️ Enhanced Stereoscopic Mode Active (Best viewed with Red/Cyan Glasses) 🕶️</div>
    </div>

    <script>
        const canvas = document.getElementById('hyper3dCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('viewportBoundary');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const shapes = [];
        const maxShapes = 45;
        const maxDepth = 800; // Deep background horizon point

        // Populate object models with structural rotation vectors
        for (let i = 0; i < maxShapes; i++) {
            shapes.push({
                x: (Math.random() - 0.5) * canvas.width * 1.8,
                y: (Math.random() - 0.5) * canvas.height * 1.8,
                z: Math.random() * maxDepth,
                size: Math.random() * 15 + 10,
                angle: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.04
            });
        }

        function drawStereoCube(ctx, x, y, size, angle, disparity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            // Draw a wireframe square block footprint
            ctx.beginPath();
            ctx.rect(-size/2 + disparity, -size/2, size, size);
            ctx.stroke();
            
            // Inner core block accent to anchor eye convergence
            ctx.beginPath();
            ctx.rect(-size/4 + disparity, -size/4, size/2, size/2);
            ctx.stroke();
            
            ctx.restore();
        }

        function renderEngineLoop() {
            // High-fade tail buffer to add extreme cinematic speed smear
            ctx.fillStyle = 'rgba(2, 5, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Sort shapes by depth (Z-index) so distant objects are drawn behind close objects
            shapes.sort((a, b) => b.z - a.z);

            for (let i = 0; i < shapes.length; i++) {
                let s = shapes[i];

                // Fly swiftly forward straight through the viewport plane
                s.z -= 4.5;
                s.angle += s.rotSpeed;

                // Recycle object safely back into extreme deep infinity background once passed eye threshold
                if (s.z <= -150) {
                    s.x = (Math.random() - 0.5) * canvas.width * 1.8;
                    s.y = (Math.random() - 0.5) * canvas.height * 1.8;
                    s.z = maxDepth;
                }

                // 3D Perspective Scale Multiplication
                const scaleFactor = 350 / (s.z + 150);
                const screenX = s.x * scaleFactor + centerX;
                const screenY = s.y * scaleFactor + centerY;
                const currentSize = s.size * scaleFactor;

                // STEREOSCOPIC DISPARITY MATH:
                // Positive disparity (far away) = Red Left, Cyan Right.
                // Zero disparity (exactly at window border frame line) = Merged Perfectly.
                // Negative disparity (POPPING OUT OUTSIDE MONITOR) = Cyan Left, Red Right!
                const focalPlaneZ = 200; // The threshold zone where objects "cross" your screen frame
                const stereoDisparity = ((s.z - focalPlaneZ) / maxDepth) * 16;

                // Skip drawing if elements have ballooned completely past normal visibility bounds
                if (screenX < -200 || screenX > canvas.width + 200 || screenY < -200 || screenY > canvas.height + 200) {
                    continue;
                }

                ctx.lineWidth = Math.max(1, (1 - (s.z / maxDepth)) * 3);

                // LAYER 1: RED CHANNEL (Left Eye Perspective shift)
                ctx.strokeStyle = 'rgba(255, 30, 60, 0.85)';
                ctx.globalCompositeOperation = 'screen';
                drawStereoCube(ctx, screenX, screenY, currentSize, s.angle, -stereoDisparity);

                // LAYER 2: CYAN CHANNEL (Right Eye Perspective shift)
                ctx.strokeStyle = 'rgba(0, 255, 230, 0.85)';
                drawStereoCube(ctx, screenX, screenY, currentSize, s.angle, stereoDisparity);
            }

            requestAnimationFrame(renderEngineLoop);
        }

        renderEngineLoop();
    </script>
</body>
</html>
