<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Anamorphic Screen Burst</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        /* Custom screen-door overlay to simulate depth thresholding */
        #screenFrame {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.4), inset 0 0 40px rgba(0, 255, 204, 0.4);
            pointer-events: none;
            box-sizing: border-box;
            z-index: 10;
            animation: pulseFrame 4s infinite alternate;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .hud {
            position: absolute;
            top: 4%;
            width: 100%;
            text-align: center;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #00ffcc;
            z-index: 20;
            pointer-events: none;
        }
        @keyframes pulseFrame {
            0% { border-color: #00ffcc; box-shadow: 0 0 30px rgba(0,255,204,0.3), inset 0 0 30px rgba(0,255,204,0.3); }
            50% { border-color: #ff3344; box-shadow: 0 0 50px rgba(255,51,68,0.5), inset 0 0 50px rgba(255,51,68,0.5); }
            100% { border-color: #33ff77; box-shadow: 0 0 30px rgba(51,255,119,0.3), inset 0 0 30px rgba(51,255,119,0.3); }
        }
    </style>
</head>
<body>

    <div class="hud">⚠️ COGNITIVE ANAMORPHIC ILLUSION: INTERFERENCE DETECTED ⚠️</div>
    <div id="screenFrame"></div>
    <canvas id="warpCanvas"></canvas>

    <script>
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');

        // Automatically snap view port parameters to full display size
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Illusion Settings
        const starCount = 250;
        const maxDepth = 1000;
        let stars = [];

        // Generate stars distributed along a deep Z-axis coordinate chain
        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * canvas.width * 2, // Spreads wide off-center
                    y: (Math.random() - 0.5) * canvas.height * 2,
                    z: Math.random() * maxDepth, // Absolute depth coordinates
                    colorIndex: Math.floor(Math.random() * 3)
                });
            }
        }

        const neonColors = ['#00ffcc', '#ff3344', '#33ff77'];

        function animateWarp() {
            // Slight motion blur trails to trick human motion perception
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Establish coordinate origin at the dead center of the screen
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];

                // Fly towards user along Z-axis
                star.z -= 8; 

                // Reset star back into the deep distance if it passes behind the viewpoint
                if (star.z <= 0) {
                    star.x = (Math.random() - 0.5) * canvas.width * 2;
                    star.y = (Math.random() - 0.5) * canvas.height * 2;
                    star.z = maxDepth;
                }

                // 3D Perspective Projection Formulas
                // As depth (z) goes to 0, 3D factor scales up toward infinity
                const factor = 450 / star.z;
                const projX = star.x * factor + centerX;
                const projY = star.y * factor + centerY;

                // Anamorphic Scaling: The objects grow exponentially the closer they get
                const radius = (1 - (star.z / maxDepth)) * 14;

                // Only render parts that fly out into the user's field of view
                if (projX >= 0 && projX <= canvas.width && projY >= 0 && projY <= canvas.height) {
                    ctx.save();
                    
                    // As elements pass the green/red screen threshold frame, make them flare intensely
                    if (star.z < 250) {
                        ctx.shadowColor = neonColors[star.colorIndex];
                        ctx.shadowBlur = 25; // High luminescence glow frame
                    }

                    ctx.fillStyle = neonColors[star.colorIndex];
                    ctx.beginPath();
                    ctx.arc(projX, projY, Math.max(0.1, radius), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(animateWarp);
        }

        initStars();
        animateWarp();
    </script>
</body>
</html>
