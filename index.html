<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TunnelUpgraded</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030307;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #illusionContainer {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1100px;
            max-height: 800px;
            background: #000;
            border: 4px solid #111;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="illusionContainer">
        <canvas id="shearCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('shearCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('illusionContainer');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let timeFactor = 0;
        const totalRings = 42; 

        // Flower geometry types
        const FLOWER_TYPES = ['star', 'gear', 'wave'];

        function runIllusionLoop() {
            // Enhanced trails for richer color blending
            ctx.fillStyle = 'rgba(3, 3, 7, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // SPEED UP: Increased step from 0.015 to 0.038 for faster movement
            timeFactor += 0.038; 

            for (let i = totalRings; i > 0; i--) {
                const zProgress = (i - (timeFactor % 1)) / totalRings;
                const scale = Math.pow(1 - zProgress, 3.5) * 12; 
                if (scale <= 0.05) continue;

                ctx.save();
                ctx.translate(centerX, centerY);

                // Anamorphic matrix distortion
                const shearAngleX = Math.sin(timeFactor * 0.5 + (i * 0.05)) * 0.55;
                const shearAngleY = Math.cos(timeFactor * 0.4 + (i * 0.04)) * 0.25;
                ctx.transform(1, shearAngleY, shearAngleX, 1, 0, 0);
                ctx.rotate(timeFactor * 0.3 + (i * 0.08));

                // COLORS: Faster rainbow shifting with multi-hue depth distribution
                const baseHue = (timeFactor * 75 + i * 15) % 360;
                const neonColor = `hsl(${baseHue}, 100%, 60%)`;
                ctx.strokeStyle = neonColor;
                ctx.lineWidth = Math.max(1.2, scale * 1.8);

                // FLOWER VARIETIES: Alternates shape patterns based on layer depth index
                const currentType = FLOWER_TYPES[i % FLOWER_TYPES.length];
                const pointsCount = 5 + (i % 4); // Dynamically cycles between 5, 6, 7, and 8 petals
                const outerRadius = scale * 45;
                const innerRadius = scale * 18;

                ctx.beginPath();

                if (currentType === 'star') {
                    // Star blossom
                    for (let p = 0; p < pointsCount * 2; p++) {
                        const currentAngle = (p * Math.PI) / pointsCount;
                        const r = (p % 2 === 0) ? outerRadius : innerRadius;
                        const px = Math.cos(currentAngle) * r;
                        const py = Math.sin(currentAngle) * r;
                        if (p === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                } 
                else if (currentType === 'gear') {
                    // Blocky mechanical gear flower
                    for (let p = 0; p < pointsCount * 2; p++) {
                        const currentAngle = (p * Math.PI) / pointsCount;
                        const nextAngle = ((p + 1) * Math.PI) / pointsCount;
                        const r = (Math.floor(p / 2) % 2 === 0) ? outerRadius : innerRadius;
                        
                        const px1 = Math.cos(currentAngle) * r;
                        const py1 = Math.sin(currentAngle) * r;
                        const px2 = Math.cos(nextAngle) * r;
                        const py2 = Math.sin(nextAngle) * r;

                        if (p === 0) ctx.moveTo(px1, py1);
                        ctx.lineTo(px1, py1);
                        ctx.lineTo(px2, py2);
                    }
                } 
                else if (currentType === 'wave') {
                    // Smooth sinusoidal curved petals
                    for (let a = 0; a <= Math.PI * 2; a += 0.05) {
                        const waveMod = Math.sin(a * pointsCount) * (outerRadius - innerRadius) * 0.5;
                        const r = ((outerRadius + innerRadius) * 0.5) + waveMod;
                        const px = Math.cos(a) * r;
                        const py = Math.sin(a) * r;
                        if (a === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                }

                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(runIllusionLoop);
        }

        runIllusionLoop();
    </script>
</body>
</html>
