<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Snake Arcade</title>
    <style>
        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin: 5px 0;
            text-shadow: 0 0 10px #00ffcc;
            letter-spacing: 3px;
        }
        #scoreDisplay {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        canvas {
            background-color: #0b1121;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            display: inline-block;
        }
        .controls {
            margin-top: 15px;
            color: #88aaff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🐍 CYBER SNAKE 🐍</h1>
    <div id="scoreDisplay">SCORE: <span id="scoreVal" style="color: #fff;">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">Use ARROW KEYS or W, A, S, D to pilot the energy snake</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');

        // Grid Configuration
        const gridSize = 20; 
        const tileCount = canvas.width / gridSize;

        // Game State Variables
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 7 };
        let dx = 1; // Starting horizontal direction vector
        let dy = 0; // Starting vertical direction vector
        let score = 0;
        let gameInterval;
        const gameSpeed = 100; // Refreshes every 100ms for stable retro pace

        // Input Keyboard Listeners 
        document.addEventListener('keydown', handleKeyPress);

        function handleKeyPress(e) {
            const key = e.key.toLowerCase();
            
            // Prevent self-collision reversals (e.g., can't move left while going right)
            if ((key === 'arrowleft' || key === 'a') && dx === 0) { dx = -1; dy = 0; }
            if ((key === 'arrowright' || key === 'd') && dx === 0) { dx = 1; dy = 0; }
            if ((key === 'arrowup' || key === 'w') && dy === 0) { dx = 0; dy = -1; }
            if ((key === 'arrowdown' || key === 's') && dy === 0) { dx = 0; dy = 1; }
        }

        function updateGame() {
            // Calculate next head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Checks
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return resetGame();
            }

            // Self Tail Collision Checks
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return resetGame();
                }
            }

            // Move the snake forward by placing the new head position at the front
            snake.unshift(head);

            // Check if snake overlaps the glowing energy food position
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreVal.textContent = score;
                spawnFood();
            } else {
                // Remove the last tail element to simulate movement if no food was eaten
                snake.pop();
            }

            renderGraphics();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Ensure food does not spawn inside the current snake body layout
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === food.x && snake[i].y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        function renderGraphics() {
            // Clear current canvas viewport
            ctx.fillStyle = '#0b1121';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Snake Segment Blocks
            for (let i = 0; i < snake.length; i++) {
                // Head is brighter cyan, body segments are standard neon green
                ctx.fillStyle = (i === 0) ? '#00ffcc' : '#33ff77';
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
            }

            // Render Energy Food Orb
            ctx.fillStyle = '#ff3344';
            ctx.shadowColor = '#ff3344';
            ctx.shadowBlur = 10; // Gives the food an arcade glow look
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0; // Turn off glow context for performance
        }

        function resetGame() {
            alert(`GAME OVER\nFinal Score: ${score}`);
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreVal.textContent = score;
            spawnFood();
        }

        // Start Core Engine Loop Execution
        spawnFood();
        gameInterval = setInterval(updateGame, gameSpeed);
    </script>
</body>
</html>
